# ~/.config/tidy/config.yaml

watch_dirs:
  - ~/Downloads

rules:
  - name: Documents
    extensions:
      [
        ".pdf",
        ".doc",
        ".docx",
        ".txt",
        ".rtf",
        ".odt",
        ".md",
        ".csv",
        ".xls",
        ".xlsx",
        ".ppt",
        ".pptx",
        ".PDF",
      ]
    dest: ~/Downloads/Documents

  - name: Images
    extensions: [".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg"]
    dest: ~/Downloads/Images

  - name: Video
    extensions: [".mp4", ".mkv", ".mov", ".avi", ".webm", ".m4v"]
    dest: ~/Downloads/Video

  - name: Audio
    extensions: [".mp3", ".wav", ".flac", ".aac", ".ogg", ".m4a"]
    dest: ~/Downloads/Music

  - name: Archives
    extensions:
      [".zip", ".rar", ".7z", ".tar", ".tar.gz", ".tgz", ".gz", ".bz2", ".xz"]
    dest: ~/Downloads/Compressed

  - name: Programs
    extensions:
      [
        ".exe",
        ".msi",
        ".deb",
        ".rpm",
        ".dmg",
        ".pkg",
        ".apk",
        ".appimage",
        ".jar",
      ]
    dest: ~/Downloads/Programs

  - name: Code
    extensions:
      [
        ".ipynb",
        ".html",
        ".css",
        ".js",
        ".ts",
        ".tsx",
        ".jsx",
        ".go",
        ".py",
        ".java",
        ".c",
        ".cpp",
        ".h",
        ".hpp",
        ".yaml",
        ".yml",
        ".xml",
        ".skill",
      ]
    dest: ~/Downloads/Code

  - name: Configs
    extensions: [".json", ".pem", ".key", ".ovpn", ".toml", ".ini", ".cfg"]
    dest: ~/Downloads/Configs

  - name: Torrents
    extensions: [".torrent"]
    dest: ~/Downloads/Torrents
