# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release binary
        run: |
          GOOS=linux   GOARCH=amd64 go build -o tidy-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -o tidy-windows-amd64.exe .
          GOOS=darwin  GOARCH=amd64 go build -o tidy-darwin-amd64 .

      - name: Create Github Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: Automatically generated from the latest push to main. This is not a stable versioned release.
          prerelease: true
          overwrite_files: true
          files: |
            tidy-linux-amd64
            tidy-windows-amd64.exe
            tidy-darwin-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
